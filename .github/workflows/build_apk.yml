name: Compile and Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Execute Gradle Wrapper Initialization Script
      run: |
        chmod +x script/setup_gradle.sh
        ./script/setup_gradle.sh

    - name: Compile Debug Application Package (APK)
      run: ./gradlew assembleDebug

    - name: Archive and Export APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-repo-explorer-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
